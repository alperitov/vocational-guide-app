name: guivo
description: "Um aplicativo de orientação vocacional"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Já tens
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.4
  uuid: ^4.5.3
  fl_chart: ^0.70.0

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2

  # Navegação
  go_router: ^14.8.1

  # Geração de código
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.6.12
  image_picker: ^1.2.1
  firebase_storage: ^12.4.10
  phosphor_flutter: ^2.1.0
  lottie: ^3.3.3
  share_plus: ^12.0.2
  url_launcher: ^6.3.2

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/transparent_logo.png"
  adaptive_icon_background: "#3B2FC9"
  adaptive_icon_foreground: "assets/transparent_logo.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5
  flutter_launcher_icons: ^0.14.4

flutter:
  assets:
    - assets/animations/
    - assets/institutions/

  uses-material-design: true